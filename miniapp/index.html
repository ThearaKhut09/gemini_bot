<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans Khmer', 'Khmer OS Battambang', system-ui, sans-serif;
    background: var(--tg-theme-secondary-bg-color, #f0f2f5);
    color: var(--tg-theme-text-color, #222);
    padding: 14px 14px 84px;
    font-size: 15px;
    line-height: 1.55;
  }
  .card {
    background: var(--tg-theme-bg-color, #fff);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 14px;
  }
  h1 { font-size: 18px; margin-bottom: 2px; }
  .hint { color: var(--tg-theme-hint-color, #888); font-size: 13px; }
  label.section { display: block; font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
  label.section:first-of-type { margin-top: 10px; }
  textarea {
    width: 100%; min-height: 110px;
    border: 1px solid var(--tg-theme-hint-color, #ccc);
    border-radius: 10px; padding: 10px; font-size: 15px; font-family: inherit;
    background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #222);
    resize: vertical;
  }
  .urgency { display: flex; gap: 8px; }
  .urgency button {
    flex: 1; padding: 10px 4px; border-radius: 10px;
    border: 1.5px solid var(--tg-theme-hint-color, #ccc);
    background: var(--tg-theme-bg-color, #fff); color: var(--tg-theme-text-color, #222);
    font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .urgency button.active { border-color: var(--tg-theme-button-color, #2481cc); font-weight: 700; }
  .file-btn {
    display: block; text-align: center; padding: 12px; cursor: pointer;
    border: 1.5px dashed var(--tg-theme-hint-color, #bbb); border-radius: 10px; font-size: 14px;
  }
  .file-name { font-size: 12px; margin-top: 6px; color: var(--tg-theme-hint-color, #888); word-break: break-all; }
  .btn-primary {
    position: fixed; left: 14px; right: 14px; bottom: 14px; z-index: 10;
    padding: 14px; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #fff);
  }
  .btn-primary:disabled { opacity: 0.6; }
  .ticket {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 10px 0; font-size: 14px;
    border-bottom: 1px solid var(--tg-theme-secondary-bg-color, #eee);
  }
  .ticket:last-child { border-bottom: none; }
  .ticket .badge { flex-shrink: 0; }
  .empty { text-align: center; color: var(--tg-theme-hint-color, #888); padding: 14px 0; font-size: 13px; }
  #devBanner {
    display: none; background: #b45309; color: #fff; text-align: center;
    padding: 6px; font-size: 12px; border-radius: 8px; margin-bottom: 12px;
  }
  #successView { text-align: center; display: none; }
  #successView .big { font-size: 46px; padding: 14px 0 4px; }
</style>
</head>
<body>
  <div id="devBanner">⚠️ DEV MODE — browser preview (not inside Telegram)</div>

  <div id="formView">
    <div class="card">
      <h1>🛠️ របាយការណ៍បញ្ហា IT</h1>
      <div class="hint">IT Support Report — សូមពិពណ៌នាបញ្ហារបស់អ្នក</div>

      <label class="section">📝 បញ្ហាដែលជួប (Describe your issue) *</label>
      <textarea id="issue" placeholder="ឧ. កុំព្យូទ័របើកមិនចេញ / Printer មិនធ្វើការ / Internet ដាច់..."></textarea>

      <label class="section">⚡ កម្រិតបន្ទាន់ (Urgency)</label>
      <div class="urgency" id="urgency">
        <button type="button" data-u="Low">🟢 ធម្មតា</button>
        <button type="button" data-u="Medium" class="active">🟡 មធ្យម</button>
        <button type="button" data-u="High">🔴 បន្ទាន់</button>
      </div>

      <label class="section">📸 រូបភាព Error (Optional photo)</label>
      <label class="file-btn" for="photo">📷 ចុចដើម្បីជ្រើសរើសរូបភាព</label>
      <input type="file" id="photo" accept="image/*" style="display:none">
      <div class="file-name" id="fileName"></div>
    </div>

    <div class="card">
      <div style="font-weight:700; font-size:14px; margin-bottom:6px;">🗂️ សំបុត្ររបស់ខ្ញុំ (My recent tickets)</div>
      <div id="ticketList"><div class="empty">កំពុងផ្ទុក... (loading)</div></div>
    </div>

    <button class="btn-primary" id="submitBtn" onclick="submitTicket()">🚀 ផ្ញើរបាយការណ៍ (Submit)</button>
  </div>

  <div id="successView" class="card">
    <div class="big">✅</div>
    <h1>ផ្ញើរួចរាល់!</h1>
    <div class="hint">ក្រុមការងារ IT បានទទួលរបាយការណ៍របស់អ្នករួចរាល់ និងសហការឱ្យឆាប់ៗ។<br>IT has received your ticket.</div>
    <br>
    <button class="btn-primary" onclick="resetForm()">📝 រាយការណ៍ម្តងទៀត (New report)</button>
  </div>

<script>
  const tg = window.Telegram ? window.Telegram.WebApp : null;
  const IN_TELEGRAM = !!(tg && tg.initData); // SDK loads everywhere, but initData only exists inside Telegram
  let urgency = 'Medium';

  if (tg) {
    tg.ready();
    tg.expand();
  }
  if (!IN_TELEGRAM) {
    document.getElementById('devBanner').style.display = 'block';
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  document.querySelectorAll('#urgency button').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('#urgency button').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      urgency = b.dataset.u;
      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.selectionChanged(); } catch (e) { } }
    });
  });

  document.getElementById('photo').addEventListener('change', function (e) {
    document.getElementById('fileName').textContent = e.target.files[0] ? e.target.files[0].name : '';
  });

  function authHeaders() {
    return { 'X-Init-Data': IN_TELEGRAM ? tg.initData : 'DEV_FAKE_USER' };
  }

  async function loadTickets() {
    const list = document.getElementById('ticketList');
    try {
      const res = await fetch('/api/tickets', { headers: authHeaders() });
      const data = await res.json();
      if (!data.ok || !data.tickets.length) {
        list.innerHTML = '<div class="empty">មិនមានសំបុត្រនៅឡើយទេ (no tickets yet)</div>';
        return;
      }
      list.innerHTML = data.tickets.map(function (t) {
        const preview = escapeHtml(t.issue.slice(0, 70)) + (t.issue.length > 70 ? '…' : '');
        return '<div class="ticket">' +
          '<div>📌 ' + preview + '<br><span class="hint">' + escapeHtml(t.timeText) + '</span></div>' +
          '<div class="badge">' + t.urgencyEmoji + ' ✅</div>' +
          '</div>';
      }).join('');
    } catch (e) {
      list.innerHTML = '<div class="empty">មិនអាចផ្ទុកបានទេ (cannot load tickets)</div>';
    }
  }

  async function submitTicket() {
    const issue = document.getElementById('issue').value.trim();
    if (!issue) {
      alert('សូមសរសេរបញ្ហាជាមុនសិន! (Please describe the issue first)');
      return;
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '⏳ កំពុងផ្ញើ...';

    try {
      const fd = new FormData();
      fd.append('issue', issue);
      fd.append('urgency', urgency);
      const photo = document.getElementById('photo').files[0];
      if (photo) fd.append('photo', photo);

      const res = await fetch('/api/tickets', { method: 'POST', headers: authHeaders(), body: fd });
      const data = await res.json();
      if (!res.ok || !data.ok) throw new Error(data.error || 'failed');

      if (tg && tg.HapticFeedback) { try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) { } }
      document.getElementById('formView').style.display = 'none';
      document.getElementById('successView').style.display = 'block';
      document.getElementById('issue').value = '';
      document.getElementById('photo').value = '';
      document.getElementById('fileName').textContent = '';
    } catch (e) {
      alert('ផ្ញើមិនបានសម្រេច សូមព្យាយាមម្តងទៀត។ (Submission failed, please try again)');
      btn.disabled = false;
      btn.textContent = '🚀 ផ្ញើរបាយការណ៍ (Submit)';
    }
  }

  function resetForm() {
    document.getElementById('successView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
    const btn = document.getElementById('submitBtn');
    btn.disabled = false;
    btn.textContent = '🚀 ផ្ញើរបាយការណ៍ (Submit)';
    loadTickets();
  }

  loadTickets();
</script>
</body>
</html>
